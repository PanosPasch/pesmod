; squad/250.ini
;
; Sample squad configuration for custom team ID 250 (0xFA). Copy this
; file into the game folder under `squad\` and rename it to match the
; teamID you're populating.
;
; Path resolution at runtime: ".\squad\<teamID>.ini" relative to the
; game's working directory (i.e. the install folder under normal
; launch). Decimal teamID is required — `250.ini`, not `0xFA.ini`.
;
; Keys (all optional):
;   slot_0..slot_31  player ID for that squad slot. Any base accepted
;                    (decimal, 0xNNNN, 0NNNN). Use 0xFFFF to leave the
;                    slot at its stock value (the hook falls through to
;                    the trampoline for that slot).
;   attr_0..attr_31  squad-number / position byte (uint8). Optional;
;                    omitted attrs read from the stock table.
;
; Player IDs:
;   * 0..4999       stock players (read from the main player table).
;   * 0x7020..0x70A0 alias-team reserved range (avoid for new players).
;   * 0x8000..0x80B7 custom-player slot range (184 reserved IDs that
;                    the stock binary never populates). Pair each
;                    custom ID here with a `player\<id>.ini` file.

[squad]
; Eleven starters — first 4 are stock players, rest are custom.
slot_0  = 100         ; stock player (a goalkeeper)
slot_1  = 200         ; stock player
slot_2  = 0x8000      ; custom player; needs player/32768.ini
slot_3  = 0x8001      ; custom player; needs player/32769.ini
slot_4  = 0x8002
slot_5  = 0x8003
slot_6  = 0x8004
slot_7  = 0x8005
slot_8  = 0x8006
slot_9  = 0x8007
slot_10 = 0x8008
; Bench / reserves — leave empty to inherit stock defaults (NULL players).
slot_11 = 0xFFFF

; Squad numbers — optional. Slots without an attr_N key keep the stock
; default (slot index + 1, roughly).
attr_0  = 1           ; goalkeeper wears #1
attr_1  = 4
attr_2  = 9           ; striker
