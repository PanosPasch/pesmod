; kits/200.ini  (sample)
;
; Per-team kit override for team ID 200 (0xC8). Copy this file into the
; game folder under `kits\` and rename it to match the team ID you want
; to override. The numeric stem is the DECIMAL team ID — `200.ini`, not
; `0xC8.ini`. Path resolves to ".\kits\<teamID>.ini" relative to the
; game's working directory.
;
; A kits/<id>.ini that exists overrides the game's own kit data for that
; team (works for stock teams too — handy for retexture mods). If the
; file is missing, the team keeps its normal in-game kit.
;
; Four kit variants are supported, one section each:
;   [variant0]  home / normal
;   [variant1]  away
;   [variant2]  third / alternate
;   [variant3]  goalkeeper alternate
; A missing variant section falls back to safe defaults (black kit,
; recognised model bytes, edited path on).
;
; Every key below is optional.
;
; Colors are RGB hex (#RRGGBB or 0xRRGGBB). They are stored internally as
; RGB555, so the low 3 bits of each channel are truncated (matches the
; game's own precision).
;
;   shirt_primary   primary shirt color
;   color1          secondary color slot (usually unused)
;   shirt           shirt color
;   shorts          shorts color
;   socks           socks color
;   gk              goalkeeper color
;
; Model bytes select the 3D kit mesh used in-match (accept any base):
;   shirt_model     shirt mesh id     (default 0x20)
;   shorts_model    shorts mesh id    (default 0x64)
;   socks_model     socks mesh id     (default 0x64)
;
;   edited          1 = "edited" render path (recommended). 0 = stock
;                   path, which additionally requires the model bytes to
;                   be values the game recognises.

[variant0]
shirt_primary = #C8102E      ; red
color1        = #FFFFFF
shirt         = #C8102E
shorts        = #FFFFFF
socks         = #C8102E
gk            = #1A8C3C      ; green keeper
shirt_model   = 0x20
shorts_model  = 0x64
socks_model   = 0x64
edited        = 1

[variant1]
shirt_primary = #FFFFFF      ; white away
color1        = #C8102E
shirt         = #FFFFFF
shorts        = #C8102E
socks         = #FFFFFF
gk            = #F2C200      ; yellow keeper
edited        = 1

; [variant2] and [variant3] omitted — they fall back to safe defaults.
