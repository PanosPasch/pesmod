; =============================================================================
; leagues/0.ini  (sample)
;
; One INI per panel slot. The filename's numeric stem is the panel slot
; index — i.e. the second argument passed to FUN_00b07b00 (SetTeamList).
; This file overrides slot 0; for slot 1 use `leagues/1.ini`, etc.
;
; Slot indexes >= 20 are allowed: at startup LoadLeaguesSetup() scans
; `leagues/*.ini` and bumps MAX_PANEL_SLOTS to (highest_id + 1) so the
; panel allocation, scroll controller, and destructor trailer all grow
; to fit. No code change needed — drop in `leagues/24.ini` and the panel
; will allocate 25 slots.
;
; Loaded by ApplyLeagueIniOverrides() (src/hooks/club_hooks_leagues.cpp)
; *after* the original-shape stride-8 loop in hook_LoadClubTeamSlots, so
; this file overrides whatever the stock loader placed in slot 0.
; =============================================================================

[league]

; League name — written into TeamSlotBuffer.name (ASCII, max ~0x400 bytes).
name = "Premier League"

; Logo / display ID — written into TeamSlotBuffer.displayID. Read by
; FUN_00b07b00 and stored into the panel slot's display ID field.
; Accepts decimal, hex (0x...), or octal (0...).
display_id = 0

; team_<n> = teamID
;
; Indices 0..(team_slot_count-1). Any index past team_slot_count is
; ignored. Missing slots are left as the empty-slot sentinel (0xFFFF)
; so the buffer is fully zeroed before applying these overrides.
;
; Values accept decimal, hex (0x...), or octal (0...).
team_0  = 100
team_1  = 101
team_2  = 102
team_3  = 103
team_4  = 104
team_5  = 105
team_6  = 106
team_7  = 107
team_8  = 108
team_9  = 109
team_10 = 110
team_11 = 111
team_12 = 112
team_13 = 113
team_14 = 114
team_15 = 115
team_16 = 116
team_17 = 117
team_18 = 118
team_19 = 119

; -----------------------------------------------------------------------------
; [panel] — page-anchor position override (LIVE in v2).
;
; What this controls:
;   Each league-selection screen has N "container panels" stacked
;   vertically (3 stock = National, Club, ML). When MAX_PANEL_SLOTS > 20
;   v2 (`hook_CreateLeagueSelectionPanel_v2`) adds extra containers,
;   one per 8-slot page. Page 3 covers slots 24..31, page 4 covers
;   32..39, etc.
;
;   The `[panel] pos_x/y/z` keys you set HERE only take effect when
;   THIS file is the **first slot of a page**, i.e. the file's name is
;   a multiple of 8 (0.ini, 8.ini, 16.ini, 24.ini, 32.ini, …).
;
;   Pages 0..2 (slots 0/8/16) inherit the stock anchor unless you
;   override. Pages 3+ (slots 24/32/…) FALL BACK to the stock anchor
;   if no override is given — which means all extras stack at the
;   same position. Provide pos_x/y/z to spread them out.
;
;   pos_x / pos_y / pos_z are absolute panel-local coordinates (same
;   space as the bone-derived anchor that param_3 of the panel creator
;   uses). Use the [PanelV2] log line to see the current values.
;
; What this does NOT yet control:
;   * Per-slot positioning within a page (scale, individual icon offsets).
;     Those are baked into the layout texture art; out of scope for now.
;   * scale / scale_y keys are still parsed but unused.
;
; Schema:
;   pos_x = ...  ; horizontal anchor of this slot's container page
;   pos_y = ...  ; vertical anchor
;   pos_z = ...  ; depth (rarely needed; defaults match stock)
;   scale   = ...   ; (parsed, not yet applied)
;   scale_y = ...   ; (parsed, not yet applied)
;
; All keys optional. Missing keys leave the page at the stock anchor.
; -----------------------------------------------------------------------------
[panel]
; pos_x   = -3.5
; pos_y   =  1.2
; pos_z   =  0.0
; scale   =  1.0
; scale_y =  1.0
