; =============================================================================
; leagues/setup.ini  (sample)
;
; Global panel-layout / parse overrides applied once at startup by
; LoadLeaguesSetup() (src/hooks/club_hooks_leagues.cpp). All keys are
; optional; missing keys leave the runtime default in place.
;
; Drop this file into your game folder as `leagues/setup.ini` (alongside
; the per-slot `leagues/<n>.ini` files).
; =============================================================================

[setup]
; How many `team_<n>` keys to parse per leagues/<id>.ini.
; Default = 20. Capped internally to TEAM_SLOT_COUNT (20) — the
; structural max of the TeamSlotBuffer.teamIDs[] array — so values
; above 20 are silently clamped. Bumping the structural max requires
; a code change (TeamSlotBuffer is a fixed-shape struct read by the
; game's FUN_00b07b00 / SetTeamList).
team_slot_count = 20

[panel]
; DW(0x00F0) and DW(0x00F4) values written by hook_CreateLeagueSelectionPanel
; (src/hooks/club_hooks_panel.cpp ~line 189).
;
; What these actually control: cols/rows of the SHARED panel cell grid.
; The same grid is reused for league selection (tiles you click) and
; team selection (the 20-team grid you see after picking a league). Each
; cell of cols*rows holds either a league logo (Screen 1) or a team
; from the active league (Screen 3) depending on UI state.
;
; Stock layout: side 0 panel = 5 cols / 4 rows, side 1+ panel = 4 / 5.
; Both stock layouts give exactly 20 cells, which matches a league's
; max team count (TeamSlotBuffer.teamIDs[20] is fixed at compile time).
;
; These values are NOT auto-grown — they stay exactly as set here,
; regardless of how many leagues/<n>.ini files exist. (cols*rows is the
; shared grid for BOTH league selection and the 20-team grid, so growing
; it past 20 would leave empty cells in team selection.)
;
; If you raise cols*rows above 20 here you WILL see garbage cells in
; team selection (each league only has 20 teams to fill them with).
; Don't touch unless you know your team data covers the full grid.
f0_side0 = 5
f4_side0 = 4
f0_side1 = 4
f4_side1 = 5

; ----------------------------------------------------------------------
; panel_count — number of "background panel" containers the league-
; selection screen draws. Stock = 3 (visually owns 8 + 8 + 4 = 20
; league-slot seats: National row, Club row, Misc/ML row). Each extra
; panel adds 8 seats to the layout, anchored at the position you
; supply via leagues/<firstSlotOfPage>.ini's [panel] pos_x/y/z keys
; (page N uses leagues/<N*8>.ini, so page 3 = leagues/24.ini, page 4
; = leagues/32.ini, etc.).
;
; If you DON'T set panel_count here, it auto-grows to:
;   max(3, ceil(MAX_PANEL_SLOTS / 8))
; — i.e. one new container per 8 extra leagues you've added. So most
; users won't need to touch this.
;
; Set explicitly when you want an extra empty container or fewer
; panels than auto-grow would create. Minimum value: 3 (matches the
; stock 8/8/4 layout).
;
; Wired in club_hooks_panel_v2.cpp's Step 9 loop.
; ----------------------------------------------------------------------
; panel_count = 4
