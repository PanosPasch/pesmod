; player/32768.ini
;
; Sample player configuration for custom player ID 32768 (0x8000) — the
; first slot of the reserved 0x8000..0x80B7 custom-player range. Copy
; this file into the game folder under `player\`.
;
; Path resolution at runtime: ".\player\<playerID>.ini" relative to the
; game's working directory. Decimal playerID is required.
;
; Player record stride is 0x7c bytes (124 bytes). The hook synthesises
; the record on first access and caches it for the lifetime of the
; process (pointer-stable; never evicted).
;
; Keys (all optional):
;   template       playerID to clone the 0x7c bytes from before applying
;                  overrides. Default = 1 (first stock player). Use
;                  0xFFFFFFFF (or -1) to skip cloning entirely (record
;                  starts as 0x7c zero bytes — likely unsafe; the high
;                  bit of several stat bytes is still unmapped, so
;                  cloning is the recommended default).
;   name           UTF-16 long-name string at +0x00. Source is
;                  interpreted as the system ANSI codepage; max 15
;                  wchars + NUL (0x20 bytes total).
;   shirt_name     ASCII shirt-name string at +0x20. Max 15 chars + NUL
;                  (0x10 bytes total).
;   callname_id    u16 at +0x30 (call-name index).
;   special_team   u8  at +0x6F.
;
;   Stat bytes (u8 each). Most have an unmapped flag in the high bit
;   (positions / movement); use byte_<off> = true/false to toggle it
;   AFTER setting the stat value below.
;     attack               (+0x32)
;     defence              (+0x33)
;     balance              (+0x34)
;     stamina              (+0x35)
;     speed                (+0x36)
;     acceleration         (+0x37)
;     response             (+0x38)
;     agility              (+0x39)
;     dribble_accuracy     (+0x3A)
;     dribble_speed        (+0x3B)
;     short_pass_accuracy  (+0x3C)
;     short_pass_speed     (+0x3D)
;     long_pass_accuracy   (+0x3E)
;     long_pass_speed      (+0x3F)
;     shot_accuracy        (+0x40)
;     shot_power           (+0x41)
;     shot_technique       (+0x42)
;     free_kick_accuracy   (+0x43)
;     swerve               (+0x44)
;     heading              (+0x45)
;     jump                 (+0x46)
;     teamwork             (+0x47)
;     technique            (+0x48)
;     aggression           (+0x49)
;     mentality            (+0x4A)
;     gk_skills            (+0x4B)
;     height               (+0x58)
;     weight               (+0x59)
;
;   byte_<off>     raw byte handle at offset <off> in [0, 0x7B]. Off
;                  accepts any base — `byte_0x32 = 80` and
;                  `byte_50 = 80` write to the same offset. Two value
;                  forms:
;                    = <number>      sets the WHOLE byte (any base)
;                    = true / false  sets / clears bit 7 (0x80) only,
;                                    preserving the lower 7 bits
;                  Use the bool form to flip still-unmapped flags in
;                  the high bit of stat bytes after a typed key has
;                  written the lower stat value. Use the number form
;                  for direct overrides of bytes we don't have a typed
;                  key for (the unmapped trailing block at +0x70..+0x7B,
;                  the still-unknown gaps at +0x4C..+0x57 and +0x5A..+0x6E).

[player]
template     = 1            ; clone from stock player ID 1
name         = "Custom Player"
shirt_name   = "CUSTOM"
callname_id  = 0
special_team = 0

; Example stat block — fairly average all-rounder.
attack               = 80
defence              = 70
balance              = 75
stamina              = 80
speed                = 78
acceleration         = 78
response             = 75
agility              = 75
dribble_accuracy     = 78
dribble_speed        = 76
short_pass_accuracy  = 80
short_pass_speed     = 78
long_pass_accuracy   = 75
long_pass_speed      = 75
shot_accuracy        = 78
shot_power           = 80
shot_technique       = 75
free_kick_accuracy   = 70
swerve               = 70
heading              = 72
jump                 = 75
teamwork             = 80
technique            = 78
aggression           = 70
mentality            = 75
gk_skills            = 50
height               = 180
weight               = 75

; High-bit flag examples — uncomment to flip bit 7 of a stat byte AFTER
; the stat above sets the lower 7. The exact meaning of these flags is
; still under research (likely position / movement coding).
; byte_0x32 = true            ; OR attack with 0x80
; byte_0x36 = false           ; AND speed  with 0x7F
