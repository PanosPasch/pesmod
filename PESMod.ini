[general]
; Master switch. 1 = install hooks normally, 0 = load but stay completely
; inert (the game runs exactly as if PESMod were not present).
enabled = 1

; Install the renderer and nothing else. 1 = every gameplay hook (clubs,
; leagues, kits, squads) is left out and only the D3D8 interception layer
; is installed; 0 = the full mod.
;
; The gameplay hooks rewrite what the game draws, so with them on, a
; difference between the game and the ray traced output could be either
; one. Turn this on when the renderer is what is being judged.
render_only = 0

[debug]
; PESMod always writes a PESMod.log next to the game executable.
; Set this to 1 to additionally open a live console window and echo log
; output to it in real time. Leave at 0 for normal play.
verbose_logging = 0

[render]
; ── D3D8 interception / Vulkan ray-traced renderer ──────────────────────
; Master switch for the renderer subsystem. 0 = the game's Direct3D 8 path
; is left completely alone (default). 1 = PESMod wraps IDirect3D8 and
; IDirect3DDevice8 so it can see the render stream.
enabled = 0

; Record per-frame statistics and allow single-frame captures. Requires
; enabled = 1. While this is on, D3DUSAGE_WRITEONLY is stripped from vertex
; and index buffers so their contents can be read back for analysis, which
; costs some upload bandwidth — leave it at 0 for normal play.
capture = 0

; Virtual-key code that dumps the next frame in full (geometry, textures,
; per-draw pipeline state). 0x78 = F9. Set to 0 to disable the hotkey.
capture_key = 0x78

; Auto-capture the frame after the first world-space (non-XYZRHW) draw —
; i.e. the moment the game stops drawing menus and renders a real 3D scene.
; Kicking off a match is then enough to capture it, with no key press.
capture_on_first_3d = 0

; Only fire that trigger once a frame carries this many world-space draws.
; A threshold of 1 fires on the team-select / kit-preview menus, which draw a
; few 3D elements; a match frame issues several hundred.
capture_min_3d_draws = 100

; Auto-capture this frame index (0 = off). Useful for unattended runs.
capture_at_frame = 0

; Where captures are written, relative to the game folder.
capture_dir = pesmod_capture

; Markdown summary of the whole session, written on exit.
session_report = pesmod_render_report.md

; ── Scene streaming to the 64-bit render host ───────────────────────────
; Publishes the world-space draw stream over shared memory so PESModHost.exe
; can ray trace it. Ray tracing cannot run inside the game: pes6.exe is a
; 32-bit process and NVIDIA's 32-bit Vulkan driver exposes no ray tracing
; extensions at all, so the renderer has to live in a separate 64-bit
; process. See docs/RENDERER.md.
;
; Enabling this implies the same interception work as `capture` (resource
; registry, readable vertex/index buffers, pipeline state shadow), so it
; carries the same cost even with capture = 0.
stream = 0

; Shared section name. Must match PESModHost's --section argument.
stream_section = Local\PESMod.SceneStream

; Ring size in MB. This is address space inside the 32-bit game process,
; which only has about 2 GB of it, so keep it modest.
stream_ring_mb = 64
